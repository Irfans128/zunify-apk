name: zunifyg
description: "ZunifyG - Ultra-Lightweight Gaming Music Player. Crafted by Fannz."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Ultra-Lean Audio Engine & Notification Media Controls
  just_audio: ^0.9.40
  audio_service: ^0.18.15

  # Minimal Networking & Local Offline Storage
  http: ^1.2.2
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/zunifyg_logo.png"
  min_sdk_android: 24
  adaptive_icon_background: "#09090B"
  adaptive_icon_foreground: "assets/images/zunifyg_logo.png"

flutter:
  uses-material-design: true
