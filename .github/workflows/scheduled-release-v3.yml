name: Scheduled Release v3.0.0 & Zidny Birthday (10 Dec 2026 00:00 WIB)

on:
  schedule:
    # 00:00 WIB on December 10, 2026 == 17:00 UTC on December 9, 2026
    - cron: '0 17 9 12 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-v3-and-notify:
    name: Publish Zunify v3.0.0 + Send Zidny Birthday FCM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Publish Draft Release v3.0.0 to Public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "v3.0.0" --draft=false --latest
          git tag -f "v3.0.0"
          git push origin "v3.0.0" --force

      - name: Send 1x Zidny Birthday + Update v3.0.0 FCM Push Notification
        env:
          SA_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$SA_JSON" ]; then
            echo "FCM_SERVICE_ACCOUNT_JSON secret is not set; skipping FCM push."
            exit 0
          fi
          node -e '
            const crypto = require("crypto");
            const sa = JSON.parse(process.env.SA_JSON);
            const now = Math.floor(Date.now() / 1000);
            const header = Buffer.from(JSON.stringify({ alg: "RS256", typ: "JWT" })).toString("base64url");
            const claim = Buffer.from(JSON.stringify({
              iss: sa.client_email,
              scope: "https://www.googleapis.com/auth/firebase.messaging",
              aud: "https://oauth2.googleapis.com/token",
              iat: now,
              exp: now + 3600
            })).toString("base64url");
            const sig = crypto.createSign("RSA-SHA256").update(`${header}.${claim}`).sign(sa.private_key, "base64url");
            const jwt = `${header}.${claim}.${sig}`;

            (async () => {
              const tokenRes = await fetch("https://oauth2.googleapis.com/token", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: `grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer&assertion=${jwt}`
              });
              const { access_token } = await tokenRes.json();
              const fcmRes = await fetch(`https://fcm.googleapis.com/v1/projects/${sa.project_id}/messages:send`, {
                method: "POST",
                headers: {
                  "Authorization": `Bearer ${access_token}`,
                  "Content-Type": "application/json"
                },
                body: JSON.stringify({
                  message: {
                    topic: "zunify_all",
                    notification: {
                      title: "🎉 Selamat Ulang Tahun, Zidny! + Zunify v3.0.0",
                      body: "Happy Birthday Zidny dari Fannz! Update Zunify v3.0.0 (Tema Classic iPod, Spotify Resume & ZunifyG) sudah rilis!",
                      image: "https://raw.githubusercontent.com/Irfans128/zunify-apk/main/assets/images/zidny_notif_banner.jpg"
                    },
                    android: {
                      priority: "high",
                      notification: {
                        channel_id: "zunify_fcm_sound_v1",
                        sound: "default"
                      }
                    }
                  }
                })
              });
              console.log("FCM Status:", fcmRes.status, await fcmRes.text());
            })();
          '
