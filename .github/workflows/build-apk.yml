name: Build Zunify Standalone APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Compile Zunify APK (by Fannz)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK (3.24.5 Stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Initialize Android Wrapper & Restore Custom Native Configs
        run: |
          mkdir -p /tmp/zunify_android_backup
          cp -r android/* /tmp/zunify_android_backup/
          rm -rf android
          flutter create --org com.fannz --project-name zunify --platforms=android .
          cp /tmp/zunify_android_backup/app/build.gradle android/app/build.gradle
          cp /tmp/zunify_android_backup/app/proguard-rules.pro android/app/proguard-rules.pro
          cp /tmp/zunify_android_backup/app/zunify-release.p12 android/app/zunify-release.p12
          cp /tmp/zunify_android_backup/app/src/main/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/kotlin/com/fannz/zunify
          cp /tmp/zunify_android_backup/app/src/main/kotlin/com/fannz/zunify/MainActivity.kt android/app/src/main/kotlin/com/fannz/zunify/MainActivity.kt
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/raw
          mkdir -p android/app/src/main/res/xml
          cp -r /tmp/zunify_android_backup/app/src/main/res/drawable/* android/app/src/main/res/drawable/ || true
          cp -r /tmp/zunify_android_backup/app/src/main/res/raw/* android/app/src/main/res/raw/ || true
          cp -r /tmp/zunify_android_backup/app/src/main/res/xml/* android/app/src/main/res/xml/ || true
          cp /tmp/zunify_android_backup/settings.gradle android/settings.gradle
          cp /tmp/zunify_android_backup/gradle.properties android/gradle.properties
          sed -i 's/gradle-.*-all.zip/gradle-8.7-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties
          rm -rf test
          flutter pub get

      - name: Generate App Launcher Icons (Gaya 2 Vinyl Logo)
        run: |
          dart run flutter_launcher_icons || true

      - name: Run Dart Static Analysis Check
        run: |
          flutter analyze lib/ --no-fatal-infos --no-fatal-warnings

      - name: Build Lightweight Split-ABI & Universal Release APK
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release

      - name: Package Lightweight & Universal APKs
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk Zunify-v1.0-Lite-arm64-by-Fannz.apk
          cp build/app/outputs/flutter-apk/app-release.apk Zunify-v1.0-Universal-by-Fannz.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk Zunify-v1.7.0-Lite-arm64-by-Fannz.apk
          cp build/app/outputs/flutter-apk/app-release.apk Zunify-v1.7.0-Universal-by-Fannz.apk

      - name: Upload Zunify APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Zunify-v1.0-Standalone-APK
          path: |
            Zunify-v1.0-Lite-arm64-by-Fannz.apk
            Zunify-v1.0-Universal-by-Fannz.apk

      - name: Publish GitHub Release for In-App Auto Updater
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APP_VER=$(grep "kAppVersion =" lib/app_version.dart | cut -d"'" -f2)
          TAG="v${APP_VER}"
          NOTES="- Perbaikan Lirik Lagu Ber-Intro Monolog/MV (Surat Cinta Untuk Starla & lagu sejenis kini punya monolog awal & sinkron akurat dengan durasi asli)\n- Tampilan Lirik Baru Lebih Estetik (Countdown Intro Musik, Indikator Instrumental • • •, Depth-of-Field Blur, & Efek Glow Lirik Aktif)\n- Bagikan Lirik ke SW / Story dengan Suara Lagu Asli (.MP4 Video + Potongan Audio Lagu Persis di Detik Lirik)\n- Rekap Mingguan (Weekly Wrapped) 2-Slide Story Baru Lebih Rapi & Proporsional di Semua Ukuran Layar HP\n- Notifikasi Sistem Otomatis saat Ada Update Baru + Fitur Broadcast Pengumuman dari Fannz ke Semua User\n- Fitur Crossfade Transisi Lagu Mulus (0s / 3s / 4s / 6s / 8s)\n- Kualitas Audio Otomatis Pintar (160 kbps Jernih saat Wi-Fi & 96 kbps Hemat Kuota saat Data Seluler)"
          gh release delete "$TAG" --yes || true
          git tag -f "$TAG"
          git push origin "$TAG" --force
          gh release create "$TAG" \
            Zunify-v1.7.0-Lite-arm64-by-Fannz.apk \
            Zunify-v1.7.0-Universal-by-Fannz.apk \
            --title "Zunify $TAG (Crafted by Fannz)" \
            --notes "$(echo -e "$NOTES")"
