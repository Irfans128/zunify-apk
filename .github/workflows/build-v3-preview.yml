name: Build Zunify v3.0.0 & ZunifyG (Draft + Preview)

on:
  push:
    branches: [ dev/v3-and-zunifyg ]
    paths-ignore:
      - 'announcements.json'
      - 'announcements/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-zunify-v3:
    name: Compile Zunify v3.0.0 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK (3.24.5 Stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Initialize Android Wrapper & Restore Configs
        run: |
          mkdir -p /tmp/zunify_android_backup
          cp -r android/* /tmp/zunify_android_backup/
          rm -rf android
          flutter create --org com.fannz --project-name zunify --platforms=android .
          cp /tmp/zunify_android_backup/app/build.gradle android/app/build.gradle
          cp /tmp/zunify_android_backup/app/proguard-rules.pro android/app/proguard-rules.pro
          cp /tmp/zunify_android_backup/app/zunify-release.p12 android/app/zunify-release.p12
          cp /tmp/zunify_android_backup/app/google-services.json android/app/google-services.json
          cp /tmp/zunify_android_backup/app/src/main/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/kotlin/com/fannz/zunify
          cp /tmp/zunify_android_backup/app/src/main/kotlin/com/fannz/zunify/*.kt android/app/src/main/kotlin/com/fannz/zunify/
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/raw
          mkdir -p android/app/src/main/res/xml
          cp -r /tmp/zunify_android_backup/app/src/main/res/drawable/* android/app/src/main/res/drawable/ || true
          cp -r /tmp/zunify_android_backup/app/src/main/res/raw/* android/app/src/main/res/raw/ || true
          cp -r /tmp/zunify_android_backup/app/src/main/res/xml/* android/app/src/main/res/xml/ || true
          cp /tmp/zunify_android_backup/settings.gradle android/settings.gradle
          cp /tmp/zunify_android_backup/gradle.properties android/gradle.properties
          sed -i 's/gradle-.*-all.zip/gradle-8.7-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties
          rm -rf test
          flutter pub get

      - name: Generate Launcher Icons
        run: |
          dart run flutter_launcher_icons || true

      - name: Run Dart Static Analysis Check
        run: |
          flutter analyze lib/ --no-fatal-infos --no-fatal-warnings

      - name: Build Zunify v3.0.0 Split-ABI & Universal Release APK
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release

      - name: Package Zunify v3.0.0 APKs
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk Zunify-v3.0.0-Lite-arm64-by-Fannz.apk
          cp build/app/outputs/flutter-apk/app-release.apk Zunify-v3.0.0-Universal-by-Fannz.apk

      - name: Upload Zunify v3.0.0 Preview Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zunify-v3.0.0-Preview-APK
          path: |
            Zunify-v3.0.0-Lite-arm64-by-Fannz.apk
            Zunify-v3.0.0-Universal-by-Fannz.apk

  prepare-draft-release:
    name: Stage Draft Release v3.0.0 (Hidden Until 10 Dec 00:00 WIB)
    needs: [ build-zunify-v3 ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Zunify v3.0.0 Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Zunify-v3.0.0-Preview-APK
          path: dist/

      - name: Setup Java & Flutter for ZunifyG
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Build ZunifyG v1.0.0
        working-directory: zunifyg
        run: |
          mkdir -p /tmp/zunifyg_android_backup
          cp -r android/* /tmp/zunifyg_android_backup/
          rm -rf android
          flutter create --org com.fannz --project-name zunifyg --platforms=android .
          cp /tmp/zunifyg_android_backup/app/build.gradle android/app/build.gradle
          cp /tmp/zunifyg_android_backup/app/proguard-rules.pro android/app/proguard-rules.pro
          cp /tmp/zunifyg_android_backup/app/zunify-release.p12 android/app/zunify-release.p12
          cp /tmp/zunifyg_android_backup/app/src/main/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/kotlin/com/fannz/zunifyg
          cp /tmp/zunifyg_android_backup/app/src/main/kotlin/com/fannz/zunifyg/*.kt android/app/src/main/kotlin/com/fannz/zunifyg/
          mkdir -p android/app/src/main/res/drawable android/app/src/main/res/raw android/app/src/main/res/values
          cp -r /tmp/zunifyg_android_backup/app/src/main/res/drawable/* android/app/src/main/res/drawable/ || true
          cp -r /tmp/zunifyg_android_backup/app/src/main/res/raw/* android/app/src/main/res/raw/ || true
          cp -r /tmp/zunifyg_android_backup/app/src/main/res/values/* android/app/src/main/res/values/ || true
          cp /tmp/zunifyg_android_backup/settings.gradle android/settings.gradle
          cp /tmp/zunifyg_android_backup/gradle.properties android/gradle.properties
          sed -i 's/gradle-.*-all.zip/gradle-8.7-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties
          rm -rf test
          flutter pub get
          dart run flutter_launcher_icons || true
          flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/debug-info
          flutter build apk --release --obfuscate --split-debug-info=build/debug-info-uni
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../dist/ZunifyG-v1.0.0-Lite-arm64-by-Fannz.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ../dist/ZunifyG-v1.0.0-Lite-arm32-by-Fannz.apk
          cp build/app/outputs/flutter-apk/app-release.apk ../dist/ZunifyG-v1.0.0-Universal-by-Fannz.apk

      - name: Create/Update Hidden Draft Release v3.0.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="- Audio Lossless FLAC Hi-Fi (Monochrome/HiFi multi-server + auto-fallback YT Music Tinggi)\n- Terjemahan lirik anti-gagal 4-server + 7 sumber lirik (BetterLyrics, LyricsPlus, SimpMusic, LRCLIB, LRC.red, NetEase, YT Music) & Duet 2 Sisi\n- Tema Baru: Classic iPod (Click Wheel & layar lirik putih minimalis), Studio Tema, Liquid Glass micro-grain optik & Neo-Brutalism\n- Transisi Hero sampul halus ala Apple Music dari Mini-Player ke Now Playing\n- Crossfade S-Curve, Grid Playlist 2 kolom, Unduh 1 Playlist sekaligus & Share Card Minimalist/Polaroid\n- Rilis perdana ZunifyG (Versi Super Ringan HP Kentang/Gaming)\n- Spesial Ulang Tahun Zidny 🎉"
          gh release delete "v3.0.0" --yes || true
          gh release create "v3.0.0" \
            dist/*.apk \
            --draft \
            --title "Zunify v3.0.0 & ZunifyG v1.0.0" \
            --notes "$(echo -e "$NOTES")"
