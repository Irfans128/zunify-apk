plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.fannz.zunify"
    compileSdk 35
    ndkVersion flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId "com.fannz.zunify"
        minSdkVersion 24
        targetSdkVersion 35
        versionCode 4
        versionName "1.4.0"
        multiDexEnabled true
    }

    signingConfigs {
        release {
            storeFile file("zunify-release.p12")
            storePassword "zunifyfannz"
            keyAlias "zunify_fannz"
            keyPassword "zunifyfannz"
            storeType "PKCS12"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}
