name: zunify
description: "Zunify - Standalone Aesthetic Music Player with Synced Bilingual Lyrics, Equalizer & Weekly Rapot. Crafted with ❤️ by Fannz."
publish_to: 'none'
version: 2.0.1+206

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Audio Engine & Background Playback (Lockscreen + Notification Controls)
  just_audio: ^0.9.40
  just_audio_background: ^0.0.1-beta.13
  audio_service: ^0.18.15
  audio_session: ^0.1.21

  # Networking & Storage (Private In-App Offline Downloads & Local Stats DB)
  http: ^1.2.2
  path_provider: ^2.1.4
  path: ^1.9.0
  sqflite: ^2.3.3+1
  shared_preferences: ^2.3.2

  # State Management & UI Aesthetics
  provider: ^6.1.2
  palette_generator: ^0.3.3+4
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1
  share_plus: ^10.0.2
  image_picker: ^1.1.2

  # Local Notifications for Weekly Rapot (Sunday 18:00 WIB)
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/zunify_logo.png"
  min_sdk_android: 24
  adaptive_icon_background: "#131311"
  adaptive_icon_foreground: "assets/images/zunify_logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
